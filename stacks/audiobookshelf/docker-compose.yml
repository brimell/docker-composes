services:
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    container_name: audiobookshelf
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "13378:80"
    volumes:
      - ${CONFIG_ROOT:-/Users/bill/Documents/GitHub/docker-composes/data}/audiobookshelf/config:/config
      - ${CONFIG_ROOT:-/Users/bill/Documents/GitHub/docker-composes/data}/audiobookshelf/metadata:/metadata
      - ${MEDIA_LOCAL_PATH:-/Users/bill/Documents/media_local}:/media_local
      - ${MEDIA_EXTERNAL_PATH:-/Volumes/Stuff/media}:/media_external
