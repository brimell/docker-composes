services:
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    container_name: audiobookshelf
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "13378:80"
    volumes:
      - ${CONFIG_ROOT:-/Users/bill/selfhosted-data}/audiobookshelf/config:/config
      - ${CONFIG_ROOT:-/Users/bill/selfhosted-data}/audiobookshelf/metadata:/metadata
      - ${MEDIA_AUDIOBOOKS_PATH:-/Volumes/Stuff/media/audiobooks}:/audiobooks
