services:
  vaultwarden:
    image: vaultwarden/server:${VAULTWARDEN_TAG:-latest}
    container_name: vaultwarden
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - TZ=${TZ:-UTC}
      - WEBSOCKET_ENABLED=true
    ports:
      - "8222:80"
      - "3012:3012"
    volumes:
      - vaultwarden_data:/data

volumes:
  vaultwarden_data:
