services:
  radarr:
    image: lscr.io/linuxserver/radarr:${RADARR_TAG:-latest}
    container_name: radarr
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
    ports:
      - "7878:7878"
    volumes:
      - radarr_config:/config
      - ${RADARR_MOVIES_PATH:-/srv/media/movies}:/movies
      - ${DOWNLOADS_PATH:-/srv/downloads}:/downloads

volumes:
  radarr_config:
