services:
  fastenhealth:
    image: ghcr.io/fastenhealth/fasten-onprem:main
    container_name: fastenhealth
    restart: unless-stopped
    ports:
      - "9090:8080"
    volumes:
      - ${CONFIG_ROOT:-/Users/bill/selfhosted-data}/fastenhealth/db:/opt/fasten/db
      - ${CONFIG_ROOT:-/Users/bill/selfhosted-data}/fastenhealth/certs:/opt/fasten/certs/shared
