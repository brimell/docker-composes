services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "8989:8989"
    volumes:
      - sonarr_config:/config
      - /Users/bill/Documents/media_local:/media_local
      - /Volumes/Stuff/media:/media_external

volumes:
  sonarr_config:
