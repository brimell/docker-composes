services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:${SONARR_TAG:-latest}
    container_name: sonarr
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
    ports:
      - "8989:8989"
    volumes:
      - sonarr_config:/config
      - ${SONARR_TV_PATH:-/srv/media/tv}:/tv
      - ${DOWNLOADS_PATH:-/srv/downloads}:/downloads

volumes:
  sonarr_config:
