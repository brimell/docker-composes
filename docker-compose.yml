services:
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "9000:9000"
      - "9443:9443"
      - "8000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - media-stack

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
    ports:
      - "8989:8989"
    volumes:
      - ./config/sonarr:/config
      - ./media/tv:/tv
      - ./downloads:/downloads
    networks:
      - media-stack

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
    ports:
      - "7878:7878"
    volumes:
      - ./config/radarr:/config
      - ./media/movies:/movies
      - ./downloads:/downloads
    networks:
      - media-stack

  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
    ports:
      - "8096:8096"
      - "8920:8920"
    volumes:
      - ./config/jellyfin:/config
      - ./cache/jellyfin:/cache
      - ./media:/media
    networks:
      - media-stack

  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    container_name: audiobookshelf
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - TZ=${TZ:-UTC}
    ports:
      - "13378:80"
    volumes:
      - ./config/audiobookshelf/config:/config
      - ./config/audiobookshelf/metadata:/metadata
      - ./media/audiobooks:/audiobooks
      - ./media/podcasts:/podcasts
    networks:
      - media-stack

  homarr:
    image: ghcr.io/homarr-labs/homarr:latest
    container_name: homarr
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - TZ=${TZ:-UTC}
    ports:
      - "7575:7575"
    volumes:
      - ./config/homarr:/appdata
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - media-stack

  uptime-kuma:
    image: louislam/uptime-kuma:latest
    container_name: uptime-kuma
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "3001:3001"
    volumes:
      - ./config/uptime-kuma:/app/data
    networks:
      - media-stack

  metabase:
    image: metabase/metabase:latest
    container_name: metabase
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - MB_DB_FILE=/metabase-data/metabase.db
      - TZ=${TZ:-UTC}
    ports:
      - "3000:3000"
    volumes:
      - metabase_data:/metabase-data
    networks:
      - media-stack

  monica-db:
    image: mariadb:11.4
    container_name: monica-db
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      - MARIADB_ROOT_PASSWORD=${MONICA_DB_ROOT_PASSWORD:-change_me_root_password}
      - MARIADB_DATABASE=${MONICA_DB_DATABASE:-monica}
      - MARIADB_USER=${MONICA_DB_USER:-monica}
      - MARIADB_PASSWORD=${MONICA_DB_PASSWORD:-change_me_monica_password}
    volumes:
      - monica_db_data:/var/lib/mysql
    networks:
      - media-stack

  monica:
    image: monica:latest
    container_name: monica
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      - monica-db
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=${MONICA_APP_URL:-http://localhost:6875}
      - APP_KEY=${MONICA_APP_KEY:-base64:Q2hhbmdlTW9uaWNhQXBwS2V5Q2hhbmdlTW9uaWNhQXBwS2V5}
      - DB_HOST=monica-db
      - DB_PORT=3306
      - DB_DATABASE=${MONICA_DB_DATABASE:-monica}
      - DB_USERNAME=${MONICA_DB_USER:-monica}
      - DB_PASSWORD=${MONICA_DB_PASSWORD:-change_me_monica_password}
      - CACHE_DRIVER=file
      - SESSION_DRIVER=file
      - QUEUE_CONNECTION=sync
      - TZ=${TZ:-UTC}
    ports:
      - "6875:80"
    volumes:
      - monica_data:/var/www/html/storage
    networks:
      - media-stack

  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - TZ=${TZ:-UTC}
      - WEBSOCKET_ENABLED=true
    ports:
      - "8222:80"
      - "3012:3012"
    volumes:
      - vaultwarden_data:/data
    networks:
      - media-stack

volumes:
  portainer_data:
  metabase_data:
  monica_data:
  monica_db_data:
  vaultwarden_data:

networks:
  media-stack:
    driver: bridge
