services:
  monica-db:
    image: mariadb:11.4
    container_name: monica-db
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      - MARIADB_ROOT_PASSWORD=${MONICA_DB_ROOT_PASSWORD:-change_me_root_password}
      - MARIADB_DATABASE=monica
      - MARIADB_USER=monica
      - MARIADB_PASSWORD=${MONICA_DB_PASSWORD:-change_me_monica_password}
    volumes:
      - ${CONFIG_ROOT:-/Users/bill/Documents/GitHub/docker-composes/data}/monica/db:/var/lib/mysql

  monica:
    image: monica:latest
    container_name: monica
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      - monica-db
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=http://localhost:6875
      - APP_KEY=${MONICA_APP_KEY:-base64:Q2hhbmdlTW9uaWNhQXBwS2V5Q2hhbmdlTW9uaWNhQXBwS2V5}
      - DB_HOST=monica-db
      - DB_PORT=3306
      - DB_DATABASE=monica
      - DB_USERNAME=monica
      - DB_PASSWORD=${MONICA_DB_PASSWORD:-change_me_monica_password}
      - CACHE_DRIVER=file
      - SESSION_DRIVER=file
      - QUEUE_CONNECTION=sync
    ports:
      - "6875:80"
    volumes:
      - ${CONFIG_ROOT:-/Users/bill/Documents/GitHub/docker-composes/data}/monica/storage:/var/www/html/storage
