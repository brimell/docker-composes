services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "8989:8989"
    volumes:
      - ${CONFIG_ROOT:-/Users/bill/Documents/GitHub/docker-composes/data}/sonarr/config:/config
      - ${MEDIA_SHOWS_PATH:-/Volumes/Stuff/media/shows}:/shows
