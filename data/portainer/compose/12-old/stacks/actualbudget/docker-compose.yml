services:
  caddy:
    image: caddy:alpine
    container_name: caddy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${CONFIG_ROOT:-/Users/bill/Documents/GitHub/docker-composes/data}/actualbudget/caddy/data:/data
      - ${CONFIG_ROOT:-/Users/bill/Documents/GitHub/docker-composes/data}/actualbudget/caddy/config:/config
    depends_on:
      - actual-server

  actual-server:
    image: actualbudget/actual-server:latest
    container_name: actual_server
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - ${CONFIG_ROOT:-/Users/bill/Documents/GitHub/docker-composes/data}/actualbudget/actual-data:/data
