services:
  photoprism:
    image: photoprism/photoprism:latest
    container_name: photoprism
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - PHOTOPRISM_ADMIN_USER=admin
      - PHOTOPRISM_ADMIN_PASSWORD=${PHOTOPRISM_ADMIN_PASSWORD:-change_me_photoprism_password}
      - PHOTOPRISM_AUTH_MODE=password
      - PHOTOPRISM_SITE_URL=http://localhost:2342/
      - PHOTOPRISM_READONLY=true
      - PHOTOPRISM_ORIGINALS_LIMIT=5000
      - PHOTOPRISM_HTTP_COMPRESSION=gzip
      - PHOTOPRISM_LOG_LEVEL=info
      - PHOTOPRISM_DISABLE_TLS=true
      - PHOTOPRISM_DISABLE_CHOWN=true
      - PHOTOPRISM_DISABLE_WEBDAV=true
    ports:
      - "2342:2342"
    volumes:
      - ${MEDIA_PHOTOS_PATH:-/Volumes/Stuff/media/photos}:/photoprism/originals:ro
      - ${CONFIG_ROOT:-/Users/bill/Documents/GitHub/docker-composes/data}/photoprism/storage:/photoprism/storage
