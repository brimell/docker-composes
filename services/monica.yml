services:
  monica:
    image: monica:latest
    container_name: monica
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=${MONICA_APP_URL:-http://localhost:6875}
      - APP_KEY=${MONICA_APP_KEY:-base64:Q2hhbmdlTW9uaWNhQXBwS2V5Q2hhbmdlTW9uaWNhQXBwS2V5}
      - DB_HOST=monica-db
      - DB_PORT=3306
      - DB_DATABASE=${MONICA_DB_DATABASE:-monica}
      - DB_USERNAME=${MONICA_DB_USER:-monica}
      - DB_PASSWORD=${MONICA_DB_PASSWORD:-change_me_monica_password}
      - CACHE_DRIVER=file
      - SESSION_DRIVER=file
      - QUEUE_CONNECTION=sync
      - TZ=${TZ:-UTC}
    ports:
      - "6875:80"
    volumes:
      - monica_data:/var/www/html/storage
    networks:
      - media-stack

volumes:
  monica_data:

networks:
  media-stack:
    driver: bridge
