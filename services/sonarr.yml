services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
    ports:
      - "8989:8989"
    volumes:
      - ../config/sonarr:/config
      - ../media/tv:/tv
      - ../downloads:/downloads
    networks:
      - media-stack

networks:
  media-stack:
    driver: bridge
