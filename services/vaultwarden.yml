services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - TZ=${TZ:-UTC}
      - WEBSOCKET_ENABLED=true
    ports:
      - "8222:80"
      - "3012:3012"
    volumes:
      - vaultwarden_data:/data
    networks:
      - media-stack

volumes:
  vaultwarden_data:

networks:
  media-stack:
    driver: bridge
