services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
    ports:
      - "8096:8096"
      - "8920:8920"
    volumes:
      - ../config/jellyfin:/config
      - ../cache/jellyfin:/cache
      - ../media:/media
    networks:
      - media-stack

networks:
  media-stack:
    driver: bridge
